services:
  - type: web
    name: conversational-todo-backend
    env: python
    region: oregon  # or your preferred region
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src:$PYTHONPATH uvicorn main:app --host 0.0.0.0 --port $PORT
    repo: https://github.com/sabterrazaqadri/GIAIC-Q4-Hackathon-2
    rootDir: Phase_3/backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        value: ${OPENAI_API_KEY}
      - key: PHASE2_API_URL
        value: https://giaic-q4-hackathon-2.onrender.com
      - key: TODO_API_BASE_URL
        value: https://giaic-q4-hackathon-2.onrender.com
